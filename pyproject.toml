[project]
name = "sqlite-viewer"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "eidas", email = "eidagm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
sqlite-viewer = "sqlite_viewer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
