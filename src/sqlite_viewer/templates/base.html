<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SQLite Viewer{% endblock %}</title>
  <style>
    :root { --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --bg: #fff; --side: #f6f8fa; --accent: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --bg: #0d1117; --side: #161b22; --accent: #4493f8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); display: flex; min-height: 100vh; }
    nav { width: 240px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border); padding: 16px; }
    nav h1 { font-size: 16px; margin: 0 0 4px; }
    nav h1 a { color: inherit; text-decoration: none; }
    nav .path { font-size: 12px; color: var(--muted); word-break: break-all; margin-bottom: 16px; }
    nav ul { list-style: none; padding: 0; margin: 0; }
    nav li a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; }
    nav li a:hover { background: var(--border); }
    nav li a.active { background: var(--accent); color: #fff; }
    main { flex: 1; padding: 24px; min-width: 0; }
    h2 { margin-top: 0; }
    a { color: var(--accent); }
    .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
    table { border-collapse: collapse; font-size: 13px; width: 100%; }
    th, td { border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; white-space: nowrap; max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
    th { background: var(--side); position: sticky; top: 0; }
    td.null { color: var(--muted); font-style: italic; }
    .pager { margin: 12px 0; display: flex; gap: 12px; align-items: center; font-size: 14px; }
    .muted { color: var(--muted); }
    th a.sort { color: inherit; text-decoration: none; display: block; }
    th a.sort:hover { color: var(--accent); }
    th .arrow { display: inline-block; width: 1.2em; font-size: 10px; color: var(--accent); }
    form.search { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; font-size: 14px; }
    form.search input[type=search] { flex: 0 1 320px; padding: 6px 8px; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
    nav ul.tools { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 13px; padding: 8px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; resize: vertical; }
    .actions { display: flex; gap: 12px; align-items: center; margin: 8px 0 16px; font-size: 13px; }
    button { padding: 6px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
    .error { padding: 10px 12px; border: 1px solid #cf222e; border-radius: 6px; color: #cf222e; font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav>
    <h1><a href="/">SQLite Viewer</a></h1>
    <div class="path">{{ db.path }}</div>
    <ul class="tools">
      <li><a href="/query" {% if sql is defined %}class="active"{% endif %}>SQL 実行</a></li>
    </ul>
    <ul>
      {% for t in tables %}
      <li><a href="/tables/{{ t | urlencode }}" {% if t == table %}class="active"{% endif %}>{{ t }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
